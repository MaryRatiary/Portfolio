    <!-- ============ Preloader (styles inline : visibles avant tout chargement) ============ -->
    <style>
      #preloader {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 22px;
        background: #f5f1eb;
        transition: opacity 0.55s ease;
      }
      :root[data-theme="dark"] #preloader { background: #14110d; }
      #preloader.done { opacity: 0; pointer-events: none; }
      #preloader .pl-mark {
        font-family: 'Instrument Serif', Georgia, 'Times New Roman', serif;
        font-style: italic;
        font-size: 64px;
        line-height: 1;
        color: #1a1612;
        animation: pl-breathe 1.6s ease-in-out infinite;
      }
      :root[data-theme="dark"] #preloader .pl-mark { color: #f2ebdc; }
      #preloader .pl-bar {
        width: 148px;
        height: 2px;
        border-radius: 999px;
        background: rgba(26, 22, 18, 0.15);
        overflow: hidden;
      }
      :root[data-theme="dark"] #preloader .pl-bar { background: rgba(242, 235, 220, 0.15); }
      #preloader .pl-bar::before {
        content: '';
        display: block;
        height: 100%;
        width: 40%;
        border-radius: 999px;
        background: #b5471e;
        animation: pl-slide 1.1s cubic-bezier(0.45, 0, 0.2, 1) infinite;
      }
      :root[data-theme="dark"] #preloader .pl-bar::before { background: #dc7c4a; }
      @keyframes pl-breathe {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.65; transform: scale(0.97); }
      }
      @keyframes pl-slide {
        0% { transform: translateX(-110%); }
        100% { transform: translateX(380%); }
      }
      @media (prefers-reduced-motion: reduce) {
        #preloader .pl-mark { animation: none; }
        #preloader .pl-bar::before { animation-duration: 2s; }
      }
      /* Fallback SEO : lisible par les robots, invisible à l'écran */
      .seo-fallback {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip-path: inset(50%);
        white-space: nowrap;
      }
    </style>
